bench = [
    { name = "perf", harness = false },
]

[package]
name = "greentic-flow"
version = "1.3.0-research.5"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Generic YGTC flow schema/loader/IR for self-describing component nodes."
repository = "https://github.com/greenticai/greentic-flow"
build = "build.rs"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/build.rs",
    "/frequent-components.json",
    "/src/**",
    "/i18n/**",
    "/schemas/**",
    "/fixtures/**",
    "/tests/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[features]
default = []
toml = [
    "dep:toml",
]

[dependencies]
anyhow = "1"
greentic-interfaces-host = ">=1.3.0-research.1, <1.4.0-0"
serde_json = "1"
ciborium = "0.2"
handlebars = "6"
thiserror = "2"
regex = "1"
lazy_static = "1"
tracing = "0.1"
blake3 = "1"
pathdiff = "0.2"
sha2 = "0.11"
semver = "1"
dashmap = "6"
url = "2"
wasmtime-wasi = "45"
wasmtime-environ = "46"
qa-spec = ">=1.3.0-research.1, <1.4.0-0"
sys-locale = "0.3"
unic-langid = "0.9"
include_dir = "0.7"
greentic-qa-lib = ">=1.3.0-research.1, <1.4.0-0"
greentic-interfaces-wasmtime = ">=1.3.0-research.1, <1.4.0-0"

[dependencies.clap]
version = "4"
features = [
    "derive",
]

[dependencies.greentic-types]
version = ">=1.3.0-research.1, <1.4.0-0"
features = [
    "telemetry-autoinit",
    "schema",
]

[dependencies.serde]
version = "1"
features = [
    "derive",
]

[dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[dependencies.jsonschema]
version = "0.48"

[dependencies.indexmap]
version = "2"
features = [
    "serde",
]

[dependencies.toml]
version = "1"
optional = true

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "macros",
]

[dependencies.chrono]
version = "0.4"
default-features = false
features = [
    "clock",
    "std",
]

[dependencies.greentic-distributor-client]
version = ">=1.3.0-research.4, <1.4.0-0"
default-features = false
features = [
    "dist-client",
    "http-runtime",
]

[dependencies.reqwest]
version = "0.13"
default-features = false
features = [
    "blocking",
    "rustls",
]

[dependencies.wasmtime]
version = "45"
features = [
    "component-model",
]

[dependencies.greentic-i18n-translator]
version = ">=1.2.0-dev, <1.3.0-0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
pretty_assertions = "1"
insta = "1"
tempfile = "3"
criterion = "0.8"

[build-dependencies]
serde_json = "1"

# Research-line chain (greentic-start#595). crates.io publishing is locked
# fleet-wide, so the research-line builds this crate needs exist only in git:
# greentic-distributor-client 1.3.0-research.4 (develop's API on the research
# line) and the greentic-secrets 1.3.0-research.3 it is built against. A patch
# section does not travel into a published crate; every consumer carries the
# same patch at its own root.
# TO UNWIND once publishing is restored: delete this block, `cargo update`.
[patch.crates-io]
greentic-distributor-client = { git = "https://github.com/greenticai/greentic-distributor-client", rev = "d594bb896c9722f439bf3c0cb98a3b85afb9b540" }
greentic-secrets-lib = { git = "https://github.com/greenticai/greentic-secrets", rev = "633934c31a4d0413885bbced87acbc29a03c7b28" }
